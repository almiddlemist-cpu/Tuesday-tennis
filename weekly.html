<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly scores · Tuesday Doubles</title>
<style>
  :root{
    --blue:#144da0; --blue-hi:#2f6ac2; --blue-dk:#0e3673;
    --yellow:#f2e916; --yellow-dk:#cbb800; --red:#cf4457;
    --bg:#f2f5fa; --card:#fff; --ink:#16213d; --muted:#5b647a;
    --line:#e5e9f1; --line-dk:#ccd5e4;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:60px}
  header{background:var(--blue);color:#fff;padding:18px 22px 16px}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px}
  .head-row{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:13px}
  .logo{background:#fff;border-radius:10px;padding:5px 9px;display:inline-flex;align-items:center;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .logo img{height:34px;display:block}
  h1{margin:0;font-size:20px;letter-spacing:-.3px;font-weight:700}
  .wk{font-family:var(--mono);font-size:13px;color:var(--yellow);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:20px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .winner{background:var(--blue);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px}
  .winner .lbl{font-size:13px;color:var(--yellow);letter-spacing:.3px}
  .winner .nm{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .winner .g{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.8)}
  .row{display:grid;grid-template-columns:46px 1fr 74px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.head{font-size:13px;color:var(--muted);background:#f7f9fc}
  .rank{font-family:var(--mono);font-weight:700;color:var(--muted)}
  .rank.one{color:var(--blue)}
  .nm{font-weight:600}
  .g{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
  .top{background:rgba(242,233,22,.13)}
  .note{font-size:13px;color:var(--muted);margin:16px 2px 0;text-align:center}
  .loading{color:var(--muted);padding:40px 0;text-align:center}
  svg{flex-shrink:0}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);background:#f7f9fc;font-weight:600}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
  th:first-child{background:#f7f9fc}
  td.nm{font-weight:600}
  td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.tot{font-family:var(--mono);font-weight:700;color:var(--blue)}
  td.best{background:rgba(242,233,22,.28);font-weight:700}
  td.none{color:var(--line-dk)}
  tr:last-child td{border-bottom:none}
</style>
</head>

      <div><h1>Weekly scores</h1><div class="wk" id="wk"></div></div>
    </div>
  </header>
  <main class="wrap" id="app"><div class="loading">Loading results…</div></main>

<script>
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const app=document.getElementById('app');
  let data;
  try{ data=await (await fetch('/api/weekly')).json(); }
  catch(e){ app.innerHTML='<div class="note">Couldn’t load scores. Try refreshing.</div>'; return; }
  if(data.setup){ app.innerHTML='<div class="note">Not set up yet.</div>'; return; }
  if(!data.ok){ app.innerHTML='<div class="note">Error: '+esc(data.error||'unknown')+'</div>'; return; }
  if(data.noResults){ app.innerHTML='<div class="note">Scores will appear here after the first Tuesday’s games.</div>'; return; }
  document.getElementById('wk').textContent=data.weeks.length+' week'+(data.weeks.length===1?'':'s')+' so far';
  // highest score in each week column gets highlighted
  const best=data.weeks.map((_,i)=>Math.max(...data.table.map(r=>r.scores[i]??-1)));
  let h='<div class="card"><div class="scroll"><table><thead><tr><th>Player</th>';
  data.weeks.forEach(w=>{h+='<th>Wk '+w+'</th>';});
  h+='<th>Total</th></tr></thead><tbody>';
  data.table.forEach(r=>{
    h+='<tr><td class="nm">'+esc(r.name)+'</td>';
    r.scores.forEach((s,i)=>{
      h+= s===null?'<td class="n none">–</td>':'<td class="n'+(s===best[i]?' best':'')+'">'+s+'</td>';
    });
    h+='<td class="tot">'+r.total+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='<div class="note">Games won each Tuesday · highlighted = top score that week · – = didn’t play.</div>';
  app.innerHTML=h;
}
load();
</script>
