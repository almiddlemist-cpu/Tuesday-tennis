<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tuesday Doubles Ladder</title>
<style>
  :root{
    --court:#123d2b; --court-hi:#1b5e3f; --ball:#cde94a; --ball-dk:#a9c832;
    --clay:#c1654a; --bg:#f3f5f2; --card:#fff; --ink:#18241d; --muted:#5f6f66;
    --line:#e3e9e4; --line-dk:#cdd6cf;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:60px}
  header{background:var(--court);color:#fff;padding:20px 22px 16px}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  .head-row{max-width:820px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:22px;letter-spacing:-.3px;display:flex;align-items:center;gap:12px}
  .ball{width:22px;height:22px;border-radius:50%;background:var(--ball);box-shadow:inset -3px -3px 0 var(--ball-dk)}
  .sub{font-family:var(--mono);font-size:13px;color:var(--ball)}
  h2{font-size:19px;letter-spacing:-.2px;margin:26px 0 4px}
  .note{font-size:13px;color:var(--muted);margin:5px 0 14px;max-width:620px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:44px 1fr 54px 90px 66px 92px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.head{font-size:13px;color:var(--muted);background:#fafcfa}
  .top{background:rgba(205,233,74,.08)}
  .rank{font-family:var(--mono);font-weight:700;color:var(--muted)}
  .rank.podium{color:var(--court)}
  .name{display:flex;align-items:center;gap:8px}
  .name b{font-weight:600}
  .c{text-align:center}.r{text-align:right}
  .pos{color:var(--court-hi)}.neg{color:var(--clay)}
  .trophy{color:var(--ball-dk);font-size:12px;font-weight:700;display:inline-flex;gap:2px;font-family:var(--mono)}
  .honour{display:grid;grid-template-columns:74px 1fr 84px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
  .honour:last-child{border-bottom:none}
  .tag{font-size:12px;color:var(--muted)}
  .banner{padding:12px 16px;margin-top:16px;border:1px solid var(--ball-dk);background:rgba(205,233,74,.16);border-radius:14px;font-size:13px}
  .setup{margin-top:20px}
  .setup ol{line-height:1.7;padding-left:20px}
  .setup code{background:#eef2ee;border:1px solid var(--line-dk);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:13px}
  .muted{color:var(--muted)}
  a{color:var(--court);font-weight:600}
  .loading{color:var(--muted);padding:40px 0}
  .pill{display:inline-block;background:rgba(255,255,255,.14);border-radius:20px;padding:3px 10px;font-size:12px;color:#fff}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <h1><span class="ball"></span> Tuesday Doubles Ladder</h1>
      <span class="sub" id="sub"></span>
    </div>
    <div class="wrap" style="padding-top:8px"><span class="pill">Live from Airtable</span></div>
  </header>
  <main class="wrap" id="app">
    <div class="loading">Loading the ladder…</div>
  </main>

<script>
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){
  const app = document.getElementById('app');
  let data;
  try { data = await (await fetch('/api/state')).json(); }
  catch(e){ app.innerHTML = '<div class="banner">Couldn\u2019t reach the server. Try refreshing.</div>'; return; }

  if(data.setup){ renderSetup(app); return; }
  if(!data.ok){ app.innerHTML = '<div class="banner">Error: '+esc(data.error||'unknown')+'</div>'; return; }

  const players = data.players.filter(p=>p.active || p.played>0).sort((a,b)=>b.r-a.r);
  document.getElementById('sub').textContent = 'Week '+data.week+' \u00b7 '+data.players.filter(p=>p.active).length+' players';

  const unresolved = (data.nights||[]).filter(n=>n.tiebreak);
  let html = '';
  if(unresolved.length){
    html += '<div class="banner"><b>'+(unresolved.length===1?'A night is waiting on a playoff.':unresolved.length+' nights are waiting on a playoff.')+'</b> <span class="muted">Settle it in the app to award the trophy.</span></div>';
  }

  html += '<h2>The ladder</h2><div class="note">Ranked by rating. Games \u00b1 is the friendly number; the rating underneath drives the pairings.</div>';
  html += '<div class="card">';
  html += '<div class="row head"><span>#</span><span>Player</span><span class="c">P</span><span class="c">W\u00b7D\u00b7L</span><span class="r">Games\u00b1</span><span class="r">Rating</span></div>';
  players.forEach((p,i)=>{
    const diff=p.gf-p.ga;
    html += '<div class="row'+(i<3?' top':'')+'">'
      + '<span class="rank'+(i<3?' podium':'')+'">'+(i+1)+'</span>'
      + '<span class="name"><b>'+esc(p.name)+'</b>'+(p.nightWins>0?'<span class="trophy">\u25B4 '+p.nightWins+'</span>':'')+'</span>'
      + '<span class="c num muted">'+p.played+'</span>'
      + '<span class="c num"><b>'+p.wins+'</b><span class="muted"> \u00b7 '+p.draws+' \u00b7 '+p.losses+'</span></span>'
      + '<span class="r num '+(diff>0?'pos':diff<0?'neg':'muted')+'" style="font-weight:700">'+(diff>0?'+':'')+diff+'</span>'
      + '<span class="r num muted">'+Math.round(p.r)+' <span style="font-size:11px">\u00b1'+Math.round(p.rd)+'</span></span>'
      + '</div>';
  });
  html += '</div>';

  const nights = (data.nights||[]).filter(n=>n.week>0);
  if(nights.length){
    html += '<h2>Night winners</h2><div class="note">Most games won on the night, week by week.</div><div class="card">';
    nights.slice(0,8).forEach(n=>{
      const names = n.winnerNames.join(n.tiebreak?'  vs  ':' & ');
      html += '<div class="honour"><span class="num tag">Week '+n.week+'</span>'
        + '<span class="name"><b>'+esc(names)+'</b>'+(n.tiebreak?'<span class="tag">\u00b7 tiebreak, unplayed</span>':'')+'</span>'
        + '<span class="r num tag">'+n.games+' games</span></div>';
    });
    html += '</div>';
  }

  app.innerHTML = html;
}

function renderSetup(app){
  document.getElementById('sub').textContent = 'Setup needed';
  app.innerHTML = '<div class="setup"><h2>One step to go live</h2>'
    + '<div class="note">The app is deployed and the backend is running \u2014 it just needs a key to read your Airtable base. This takes about two minutes and only you can do it (it\u2019s your account\u2019s credential).</div>'
    + '<div class="card" style="padding:16px 20px"><ol>'
    + '<li>Open <a href="https://airtable.com/create/tokens" target="_blank" rel="noopener">airtable.com/create/tokens</a> and create a personal access token.</li>'
    + '<li>Give it the scopes <code>data.records:read</code> and <code>data.records:write</code>, and add access to the <b>Tuesday Doubles Ladder</b> base.</li>'
    + '<li>In your Vercel project \u2192 Settings \u2192 Environment Variables, add <code>AIRTABLE_TOKEN</code> (the token) and <code>AIRTABLE_BASE_ID</code> = <code>appHS8TotHpCLuRib</code>.</li>'
    + '<li>Redeploy (Vercel \u2192 Deployments \u2192 latest \u2192 Redeploy), then refresh this page.</li>'
    + '</ol></div>'
    + '<div class="note">Once it\u2019s connected, this page shows your live ladder pulled straight from Airtable.</div></div>';
}

load();
</script>
</body>
</html>
