<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tuesday Doubles Ladder · Maidstone Tennis Academy</title>
<style>
  :root{
    --blue:#144da0; --blue-hi:#2f6ac2; --blue-dk:#0e3673;
    --yellow:#f2e916; --yellow-dk:#cbb800; --red:#cf4457;
    --bg:#f2f5fa; --card:#fff; --ink:#16213d; --muted:#5b647a;
    --line:#e5e9f1; --line-dk:#ccd5e4;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:60px}
  header{background:var(--blue);color:#fff;padding:18px 22px 16px}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  .head-row{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{background:#fff;border-radius:10px;padding:5px 9px;display:inline-flex;align-items:center;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .logo img{height:34px;display:block}
  h1{margin:0;font-size:21px;letter-spacing:-.3px;font-weight:700}
  .sub{font-family:var(--mono);font-size:13px;color:var(--yellow)}
  h2{font-size:19px;letter-spacing:-.2px;margin:26px 0 4px}
  .note{font-size:13px;color:var(--muted);margin:5px 0 14px;max-width:620px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:44px 1fr 54px 96px 66px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.head{font-size:13px;color:var(--muted);background:#f7f9fc}
  .top{background:rgba(242,233,22,.13)}
  .rank{font-family:var(--mono);font-weight:700;color:var(--muted)}
  .rank.podium{color:var(--blue)}
  .name{display:flex;align-items:center;gap:8px}
  .name b{font-weight:600}
  .c{text-align:center}.r{text-align:right}
  .pos{color:var(--blue-hi)}.neg{color:var(--red)}
  .trophy{color:var(--yellow-dk);font-size:12px;font-weight:700;display:inline-flex;gap:2px;font-family:var(--mono);align-items:center}
  .honour{display:grid;grid-template-columns:74px 1fr 84px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
  .honour:last-child{border-bottom:none}
  .tag{font-size:12px;color:var(--muted)}
  .banner{padding:12px 16px;margin-top:16px;border:1px solid var(--yellow-dk);background:rgba(242,233,22,.16);border-radius:14px;font-size:13px}
  .muted{color:var(--muted)}
  a{color:var(--blue);font-weight:600}
  .loading{color:var(--muted);padding:40px 0}
  .pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:20px;padding:3px 10px;font-size:12px;color:#fff}
  .setup{margin-top:20px}
  .setup ol{line-height:1.7;padding-left:20px}
  .setup code{background:#eaf0f8;border:1px solid var(--line-dk);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:13px}
</style>
</head>

      </div>
      <span class="sub" id="sub"></span>
    </div>
    <div class="wrap" style="padding-top:10px"><span class="pill">Club ladder</span></div>
  </header>
  <main class="wrap" id="app"><div class="loading">Loading the ladder…</div></main>

<script>
const esc=(s)=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const app=document.getElementById('app');
  let data;
  try{ data=await (await fetch('/api/state')).json(); }
  catch(e){ app.innerHTML='<div class="banner">Couldn’t reach the server. Try refreshing.</div>'; return; }
  if(data.setup){ renderSetup(app); return; }
  if(!data.ok){ app.innerHTML='<div class="banner">Error: '+esc(data.error||'unknown')+'</div>'; return; }

  const players=data.players.filter(p=>p.active||p.played>0).sort((a,b)=>b.r-a.r);
  document.getElementById('sub').textContent='Week '+data.week+' · '+data.players.filter(p=>p.active).length+' players';

  const unresolved=(data.nights||[]).filter(n=>n.tiebreak);
  let html='';
  if(unresolved.length){
    html+='<div class="banner"><b>'+(unresolved.length===1?'A night is waiting on a playoff.':unresolved.length+' nights are waiting on a playoff.')+'</b> <span class="muted">The coach will settle it.</span></div>';
  }
  html+='<h2>The ladder</h2><div class="note">Standings across the season. Games ± is games won minus games lost.</div>';
  html+='<div class="card">';
  html+='<div class="row head"><span>#</span><span>Player</span><span class="c">P</span><span class="c">W · D · L</span><span class="r">Games ±</span></div>';
  players.forEach((p,i)=>{
    const diff=p.gf-p.ga;
    html+='<div class="row'+(i<3?' top':'')+'">'
      +'<span class="rank'+(i<3?' podium':'')+'">'+(i+1)+'</span>'
      +'<span class="name"><b>'+esc(p.name)+'</b>'+(p.nightWins>0?'<span class="trophy">▴ '+p.nightWins+'</span>':'')+'</span>'
      +'<span class="c num muted">'+p.played+'</span>'
      +'<span class="c num"><b>'+p.wins+'</b><span class="muted"> · '+p.draws+' · '+p.losses+'</span></span>'
      +'<span class="r num '+(diff>0?'pos':diff<0?'neg':'muted')+'" style="font-weight:700">'+(diff>0?'+':'')+diff+'</span>'
      +'</div>';
  });
  html+='</div>';

  const nights=(data.nights||[]).filter(n=>n.week>0);
  if(nights.length){
    html+='<h2>Night winners</h2><div class="note">Most games won on the night, week by week.</div><div class="card">';
    nights.slice(0,8).forEach(n=>{
      const names=n.winnerNames.join(n.tiebreak?'  vs  ':' & ');
      html+='<div class="honour"><span class="num tag">Week '+n.week+'</span>'
        +'<span class="name"><b>'+esc(names)+'</b>'+(n.tiebreak?'<span class="tag">· tiebreak</span>':'')+'</span>'
        +'<span class="r num tag">'+n.games+' games</span></div>';
    });
    html+='</div>';
  }
  app.innerHTML=html;
}
function renderSetup(app){
  document.getElementById('sub').textContent='Setup needed';
  app.innerHTML='<div class="setup"><h2>One step to go live</h2>'
    +'<div class="note">The backend is running — it just needs its Airtable environment variables set in Vercel.</div></div>';
}
load();
</script>
